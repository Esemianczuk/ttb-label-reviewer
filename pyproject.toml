[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttb-label-reviewer-tools"
version = "0.1.0"
description = "Shared test, validation, and public COLA fixture collector tooling for the TTB Label Reviewer prototype."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tools*", "ttb_validation*"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/worker"]
testpaths = ["tests", "apps/api/app/tests", "apps/worker/tests"]
addopts = "-q"
