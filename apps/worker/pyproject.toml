[project]
name = "ttb-label-reviewer-worker"
version = "0.1.0"
description = "Local/distributed worker agent for the TTB Label Reviewer coordinator."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
discovery = [
  "zeroconf>=0.132,<1",
]
ocr = [
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
]
test = [
  "pytest>=8",
]

[project.scripts]
ttb-worker = "ttb_worker.main:main"
