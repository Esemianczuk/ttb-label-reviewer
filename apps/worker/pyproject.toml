[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttb-label-reviewer-worker"
version = "0.1.0"
description = "Local backend worker agent for the TTB Label Reviewer coordinator."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
discovery = [
  "zeroconf>=0.132,<1",
]
ocr = [
  "Pillow>=10,<12",
]
paddleocr = [
  "paddleocr==3.2.0",
  "paddlex==3.2.0",
]
all-ocr = [
  "Pillow>=10,<12",
  "paddleocr==3.2.0",
  "paddlex==3.2.0",
]
test = [
  "pytest>=8",
]

[project.scripts]
ttb-worker = "ttb_worker.main:main"

[tool.setuptools.packages.find]
include = ["ttb_worker*"]
