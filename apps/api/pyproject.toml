[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttb-label-reviewer-api"
version = "0.1.0"
description = "Optional FastAPI coordinator for the local-first TTB Label Reviewer."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "Pillow>=10,<12",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
discovery = ["zeroconf>=0.132,<1"]
test = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]
