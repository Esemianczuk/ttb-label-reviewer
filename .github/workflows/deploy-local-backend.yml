name: Deploy local backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on self-hosted RTX backend
    runs-on:
      - self-hosted
      - linux
      - ttb-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy production Compose stack
        run: ./scripts/deploy-production-compose.sh
