name: Docker images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
            tag: ttb-label-reviewer-api
          - image: worker
            dockerfile: docker/worker.Dockerfile
            tag: ttb-label-reviewer-worker
          - image: worker-cuda
            dockerfile: docker/worker-cuda.Dockerfile
            tag: ttb-label-reviewer-worker-cuda

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/esemianczuk/${{ matrix.tag }}:${{ github.ref_name }}
            ghcr.io/esemianczuk/${{ matrix.tag }}:latest
