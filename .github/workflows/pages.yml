name: Deploy frontend to GitHub Pages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static console
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            browser-demo/package-lock.json
            apps/console/package-lock.json

      - name: Install browser fallback dependencies
        run: npm ci --prefix browser-demo

      - name: Install console dependencies
        run: npm ci --prefix apps/console

      - name: Build console for Pages
        env:
          VITE_TTB_BACKEND_URL: ${{ vars.TTB_PROD_BACKEND_URL || 'https://demo.sherpa-map.com' }}
          VITE_BASE_PATH: ./
        run: |
          npm --prefix apps/console run build
          touch apps/console/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/console/dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
