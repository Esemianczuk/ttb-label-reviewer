name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python environment
        run: python scripts/check-python-env.py

      - name: Run Python tests
        run: python -m pytest -q

  javascript:
    name: JavaScript tests and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            browser-demo/package-lock.json
            apps/console/package-lock.json

      - name: Install browser fallback dependencies
        run: npm ci --prefix browser-demo

      - name: Install console dependencies
        run: npm ci --prefix apps/console

      - name: Run browser fallback tests
        run: npm --prefix browser-demo test

      - name: Run console tests
        run: npm --prefix apps/console test

      - name: Build browser fallback
        run: npm --prefix browser-demo run build

      - name: Build console
        run: npm --prefix apps/console run build

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: false
          tags: ttb-label-reviewer-api:ci

      - name: Build CPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          load: false
          tags: ttb-label-reviewer-worker:ci
